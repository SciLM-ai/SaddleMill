[Main]
executorlib = True
method = Sella
dir_path = ../Dimer_OC22/data
jobs_per_gpu = 16
Calculator = FAIRChemCalculator
fmax = 0.01
steps = 300

[FAIRChemCalculator]
device = cuda
name_or_path = uma-s-1p2
task_name = oc22

[ourSella]
dataset_type = oc  # use bulk for SaddleFlow outputs: they carry their own FixAtoms and all-zero tags, and oc re-freezes every tag-0 atom
reaction_types = initial_guess
num_attempts_per_type = 1
supercell = False
delocalization_threshold = 0.99
check_index = True
index_eps = 2e-3
index_tol = 1e-2

[Sella]
order = 1
delta0 = 0.1
