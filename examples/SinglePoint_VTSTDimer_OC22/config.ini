# VTST dimer saddle search on OC22-style oxide adslabs, run as a SinglePoint job.
# Exact Meta OC22 level of theory (input_generator = oc22): PBE + MP Hubbard U,
# spin-polarized with MP-default initial moments, ENCUT 500, ISMEAR 0 / SIGMA
# 0.05, PREC Accurate, ceil(30/a) x ceil(30/b) x 1 k-mesh, 2022 MPRelaxSet
# POTCARs (W_sv fix, PBE 5.4 library), LREAL False. [Vasp] below only adds the
# VTST dimer driver, tight SCF and file-writing suppression; no electronic
# overrides. Use this to reconverge cheap_oc22 first-pass saddles.
# Inputs should carry OC tags (tag 2 = adsorbate): the preset applies the dipole
# correction only when tag-2 atoms are present, like Meta's adslab-only rule.

[Main]
executorlib = True
method = SinglePoint
dir_path = data            # *.traj files whose frames have .info['eigenmodes3'] or ['approx_eigenmode']
device = 'cpu'
Calculator = Vasp
zip = True
max_consecutive_errors = 0
jobs_per_node = 4

[Vasp]
ichain = 2                 # select the dimer method
ibrion = 3                 # external optimizer drives the ionic steps
potim = 0                  # no VASP-internal ionic step
iopt = 3                   # QuickMin: force-driven translation (no fixed jump), capped by maxmove
maxmove = 0.1              # cap on the dimer-center translation step (A)
ddr = 0.01                 # dimer image separation (A) for the curvature finite-difference
lreal = false              # disable real-space projection (also OC22's own setting)
drotmax = 6                # max dimer rotations per translation
dfnmin = 0.01              # stop rotating once the rotational force is below this
dposmax = 1000             # stop dimer if dimer run has this many consecutive positive curvatures
nsw = 600                  # max dimer (ionic) steps
timestep = 0.1             # VTST QuickMin step (POTIM stays 0)
ediff = 1e-7               # tight SCF for clean dimer forces (OC22's own EDIFF is 1e-4)
ediffg = -0.05             # saddle force-convergence (eV/A) — same criterion OC22 used
lcharg = False             # don't write CHGCAR
lwave = False              # don't write WAVECAR (the preset sets LWAVE=True)
lvtot = False              # don't write LOCPOT (OC22 kept it for work functions; useless here)
pp = PBE                   # POTCAR family (oc22 sets this too; pinned for safety)
pp_version = 54            # use $VASP_PP_PATH/potpaw_PBE.54 (the library OC22 used)
ncore = 8                  # overrides the preset's NCORE=4 for the 32-rank ls6 jobs

[ourVasp]
input_generator = oc22            # exact Meta OC22 settings; self-contained, no extra deps
extra_input_files = modecar       # write MODECAR from each frame's eigenmodes3[0], else approx_eigenmode
extra_outputs = vtst_dimer        # read NEWMODECAR/DIMCAR -> approx_eigenmode/approx_curvature onto the output frame

[ourSinglePoint]
# ls6 (128 cores/node): 4 jobs/node x 32 ranks = 128
vasp_command = "unset PMI2_FD PMI_FD PMI2_RANK PMI_RANK PMI2_SIZE PMI_SIZE PMI2_SPROUTE; I_MPI_HYDRA_BOOTSTRAP=fork OMP_NUM_THREADS=1 mpirun -n 32 vasp_std"
