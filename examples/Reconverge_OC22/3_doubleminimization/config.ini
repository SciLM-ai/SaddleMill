[Main]
executorlib = True
method = DoubleMinimization
dir_path = ../2_hessian/index1  # written by select_index1.py: the index-1 saddles only
Optimizer = FIRE
jobs_per_gpu = 16
Calculator = FAIRChemCalculator
fmax = 0.005  # the minima as tightly converged as the saddle
steps = 1000

[FAIRChemCalculator]
device = cuda
name_or_path = uma-s-1p2
task_name = oc22

[MDMin]
dt = 0.005
maxstep = 0.1

[FIRE]  # the DoubleMinimization_OC22 example settings
dt = 0.05
maxstep = 0.1
dtmax = 0.2
downhill_check = False
