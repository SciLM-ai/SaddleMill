[Main]
executorlib = True
method = Sella
dir_path = ../data  # the dataset's saddle labels (one frame per saddle, with the slab's FixAtoms); info src_index = triplet id
jobs_per_gpu = 16
Calculator = FAIRChemCalculator
fmax = 0.005
steps = 500
threads_per_job = 1  # the default; one CPU math thread per job (multithreaded BLAS was 10x slower on 225-atom slabs)

[FAIRChemCalculator]
device = cuda
name_or_path = uma-s-1p2
task_name = oc22

[ourSella]
dataset_type = bulk  # labels carry their own FixAtoms; oc would re-freeze every tag-0 atom
reaction_types = initial_guess
num_attempts_per_type = 1
supercell = False
delocalization_threshold = 0.99
check_index = False  # the index is checked with the exact Hessian in stage 2
gpu_eigh = True  # the default; Sella's step eigenproblem on the GPU when the GPU-enabled Sella is installed

[Sella]
order = 1
delta0 = 0.1
eta = 0.001  # Sella's default 1e-4 finite-difference step drowns in GPU force noise and can stall the mode search
