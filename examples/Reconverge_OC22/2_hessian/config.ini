[Main]
executorlib = True
method = SinglePoint
dir_path = ../1_sella/Sella_trajes  # the reconverged saddles (only converged ones are written there with status converged)
input_statuses = converged converged_after_extension
jobs_per_gpu = 2  # the exact Hessian is GPU-bound and memory-heavy (~30 GB per job on 80-280-atom slabs at hessian_chunk 4)
Calculator = FAIRChemCalculator

[FAIRChemCalculator]
device = cuda
name_or_path = uma-s-1p2
task_name = oc22

[ourSinglePoint]
compute_eigenmodes = True  # exact UMA Hessian over the free atoms; eigenvalues + eigenmodes3[0] (the mode stage 3 follows)
hessian_chunk = 4
frames_per_job = 1
