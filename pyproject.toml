[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saddlemill"
version = "0.1.0"
description = "High-throughput transition state search using neural network potentials or DFT"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Ilgar Baghishov"}, {name = "Sung Hoon Jung"}, {name = "Graeme Henkelman"}]
requires-python = ">=3.10"
dependencies = [
    "ase>=3.26.0",
    "fairchem-core>=2.19.0",
    "numpy",
    "scipy",
    "matplotlib",
]

[project.urls]
Homepage = "https://github.com/SciLM-ai/SaddleMill"
Repository = "https://github.com/SciLM-ai/SaddleMill"
Dataset = "https://huggingface.co/datasets/SciLM/MaterialsSaddles"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-timeout",
]
gpu = [
    "torch",
]
distributed = [
    "executorlib",
]
# method = Sella (P-RFO saddle search); imported only by sellaopt.py, so the other methods work without it.
sella = [
    "sella>=2.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: tests requiring CUDA GPU (deselect with '-m not gpu')",
    "flux: tests requiring Flux scheduler + executorlib (deselect with '-m not flux')",
    "slow: tests taking >60 seconds",
]
timeout = 600
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.setuptools.packages.find]
include = ["saddlemill*"]
